# Member-owned route classification; requirements remain in pyproject.toml.
# Coordination: uibcdf/argdigest#28 and uibcdf/molsyssuite#45.
schema = "molsyssuite.dependency-routes@1"
reason = "Reviewed ArgDigest required-runtime, build, optional-test and publication routes"
source_routes = []
source_reason = "Required DepDigest and SMonitor remain publicly Conda-supplied in maintained member workflows. Editable ArgDigest is the subject package, not a required sibling replacement. The optional PyUnitWizard fixture is pinned to public 0.27.0. A future required sibling source route needs its own reviewed full commit and installed provenance."

[shared_tool]
repository = "uibcdf/molsyssuite"
commit = "43b9f94bf5ab0ec3f54a4b2ca5b23b791d6af0bc"

[[recipes]]
path = "devtools/conda-build/meta.yaml"
kind = "shared-noarch"
plan = "devtools/conda-build/release_plan.toml"
resources = "devtools/conda-build/resources.toml"
reason = "One public noarch artifact; shared recipe/run/version/resource/launcher controls are retained."

[[environments]]
path = "devtools/conda-envs/development_env.yaml"
kind = "runtime"
reason = "Routine Python 3.14 development plus docs/test tools; create with strict priority."
channel_priority = "strict"
python_minor = "3.14"

[[environments]]
path = "devtools/conda-envs/docs_env.yaml"
kind = "runtime"
reason = "Sphinx imports installed ArgDigest; the supported 3.13 documentation selection remains reviewed."
channel_priority = "strict"
python_minor = "3.13"

[[environments]]
path = "devtools/conda-envs/test_env.yaml"
kind = "runtime"
reason = "Routine wheel/source tests supply required runtime through Conda; workflows select their supported interpreter cell."
channel_priority = "strict"

[[environments]]
path = "devtools/conda-envs/test_env_core.yaml"
kind = "runtime"
reason = "Full-matrix and historical feasibility source tests; this tooling environment includes optional science fixtures and is distinct from the NumPy-free installed-core artifact profile."
channel_priority = "strict"

[[environments]]
path = "devtools/conda-envs/build_env.yaml"
kind = "build-only"
reason = "Build/upload bootstrap; the recipe host supplies the separate build environment and this file does not install ArgDigest."

