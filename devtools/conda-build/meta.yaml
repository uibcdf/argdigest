package:
  name: argdigest
  version: "{{ environ['GIT_DESCRIBE_TAG'] }}"

source:
  path: ../../   # repo root

build:
  number: "{{ environ.get('ARGDIGEST_CONDA_BUILD_NUMBER', '0') }}"
  noarch: python
  entry_points:
    - argdigest = argdigest.cli:main

requirements:
  host:
    - python >=3.11,<3.15
    - pip
    - setuptools >=61.0
    - versioningit >=3.0.0
  run:
    - python >=3.11,<3.15
    - depdigest >=0.11.0
    - numpy >=1.20.0
    - smonitor >=0.16.0

test:
  imports:
    - argdigest
  commands:
    - python -c "import argdigest, importlib.metadata as md, os; expected=os.environ['PKG_VERSION']; assert md.version('argdigest') == expected; assert argdigest.__version__ == expected"
    - argdigest --help

about:
  home: "https://github.com/uibcdf/argdigest"
  license: "MIT"
  summary: "Flexible argument auditing and normalization for scientific libraries."
