channels:
  - uibcdf
  - conda-forge

dependencies:
  - python >=3.11,<3.15
  - pip
  - setuptools
  - pytest
  - pytest-xdist
  - pytest-receptor ==1.1.0
  - numpy >=1.20.0
  - pydantic >=2.0.0
  - beartype >=0.16.0
  - pandas >=2.0.0
  - pyyaml >=6.0
  - pint
  - versioningit
  - depdigest >=0.11.0
  - smonitor >=0.16.0
  - pyunitwizard ==0.27.0
