channels:
  - uibcdf
  - conda-forge

dependencies:
  # --- Python base ---
  - python >=3.11,<3.15
  - pip

  # --- Test tools ---
  - pytest
  - pytest-receptor ==1.1.0
  - pytest-cov
  - pytest-xdist
  - ruff

  # --- Dependencies ---
  - beartype >=0.16.0
  - pydantic >=2.0.0
  - pyunitwizard ==0.27.0
  - versioningit
  - pyyaml >=6.0
  - numpy >=1.20.0
  - pandas >=2.0.0
  - smonitor >=0.16.0
  - depdigest >=0.11.0
