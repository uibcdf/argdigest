channels:
  - uibcdf
  - conda-forge

dependencies:
  # --- Python base ---
  - python=3.14
  - pip
  - jupyterlab

  # --- Dev tools: formatting, linting, testing ---
  - ruff ==0.16.5
  - pytest
  - pytest-cov
  - beartype >=0.16.0
  - pydantic >=2.0.0
  - versioningit
  - pyyaml >=6.0
  - numpy >=1.20.0
  - pandas >=2.0.0
  - smonitor >=0.16.0
  - depdigest >=0.11.0

  # --- Documentation with Sphinx and MyST ---
  - sphinx
  - pydata-sphinx-theme
  - sphinxcontrib-bibtex
  - sphinx-remove-toctrees
  - sphinx-copybutton
  - sphinx-design
  - sphinx-favicon
  - sphinx-tabs
  - nbsphinx
  - ipykernel
  - pandoc
  - myst-nb
