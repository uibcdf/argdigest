channels:
  - uibcdf
  - conda-forge

dependencies:
  # --- Python base ---
  - python=3.13
  - pip

  # --- Documentation with Sphinx and MyST ---
  - sphinx
  - sphinxcontrib-bibtex
  - sphinx-remove-toctrees
  - sphinx-copybutton
  - sphinx-design
  - sphinx-favicon
  - sphinx-tabs
  - pydata-sphinx-theme
  - nbsphinx
  - ipykernel
  - pandoc
  - myst-nb  

  # --- Library dependencies (for autodoc) ---
  - beartype >=0.16.0
  - pydantic >=2.0.0
  - versioningit
  - pyyaml >=6.0
  - numpy >=1.20.0
  - pandas >=2.0.0
  - depdigest >=0.11.0
  - smonitor >=0.16.0
