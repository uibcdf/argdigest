name: CI Full Matrix

on:
  schedule:
    - cron: "0 9 * * MON"
  workflow_dispatch:

jobs:
  full-test:
    name: Full test on ${{ matrix.cfg.os }}, Python ${{ matrix.cfg.python-version }}
    runs-on: ${{ matrix.cfg.os }}
    timeout-minutes: 90
    concurrency:
      group: ci-full-matrix-${{ github.workflow }}-${{ github.ref }}-${{ matrix.cfg.os }}-${{ matrix.cfg.python-version }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: ubuntu-latest, python-version: "3.11", environment-file: "devtools/conda-envs/test_env.yaml" }
          - { os: ubuntu-latest, python-version: "3.12", environment-file: "devtools/conda-envs/test_env.yaml" }
          - { os: ubuntu-latest, python-version: "3.13", environment-file: "devtools/conda-envs/test_env.yaml" }
          - { os: ubuntu-latest, python-version: "3.14", environment-file: "devtools/conda-envs/test_env_core.yaml" }
          - { os: macos-latest, python-version: "3.11", environment-file: "devtools/conda-envs/test_env.yaml" }
          - { os: macos-latest, python-version: "3.12", environment-file: "devtools/conda-envs/test_env.yaml" }
          - { os: macos-latest, python-version: "3.13", environment-file: "devtools/conda-envs/test_env.yaml" }
          - { os: macos-latest, python-version: "3.14", environment-file: "devtools/conda-envs/test_env_core.yaml" }
          - { os: windows-latest, python-version: "3.11", environment-file: "devtools/conda-envs/test_env_core.yaml" }
          - { os: windows-latest, python-version: "3.12", environment-file: "devtools/conda-envs/test_env_core.yaml" }
          - { os: windows-latest, python-version: "3.13", environment-file: "devtools/conda-envs/test_env_core.yaml" }
          - { os: windows-latest, python-version: "3.14", environment-file: "devtools/conda-envs/test_env_core.yaml" }

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Additional info about the build
      shell: bash
      run: |
        uname -a

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.cfg.python-version }}

    - name: Setup conda env
      uses: mamba-org/setup-micromamba@v3.2.1
      with:
        environment-file: ${{ matrix.cfg.environment-file }}
        environment-name: test
        condarc: |
          channels:
            - uibcdf
            - conda-forge
          channel_priority: strict
        create-args: >-
          python=${{ matrix.cfg.python-version }}
        cache-downloads: true

    - name: Info conda
      shell: bash -l {0}
      run: |
        micromamba activate test
        micromamba info
        micromamba list

    - name: Install package
      shell: bash -l {0}
      run: |
        python -m pip install . --no-deps

    - name: Test import module
      shell: bash -l {0}
      run: |
        set -euo pipefail
        echo "::group::Importing module from home directory"
        trap 'echo "::endgroup::"' EXIT
        cd
        pwd
        python -c 'import argdigest; print("Version of the package: {}".format(argdigest.__version__))'

    - name: Run tests
      shell: bash -l {0}
      run: |
        python -m pytest --receptor=ci -n 4 -q
