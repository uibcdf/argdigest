name: Test staged Conda package
run-name: Installed ${{ inputs.filename }} ${{ inputs.sha256 }}
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full producer source SHA
        required: true
        type: string
      filename:
        description: Exact staged noarch filename
        required: true
        type: string
      sha256:
        description: SHA-256 from the producer receipt
        required: true
        type: string
permissions:
  contents: read
jobs:
  installed:
    uses: uibcdf/molsyssuite/.github/workflows/test-installed-noarch-conda.yaml@13a661e348275496a677a1bfe9650d68a03713a3
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
      filename: ${{ inputs.filename }}
      sha256: ${{ inputs.sha256 }}
