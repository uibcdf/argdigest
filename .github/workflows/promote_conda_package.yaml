name: Promote qualified Conda package
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full producer source SHA
        required: true
        type: string
      version:
        required: true
        type: string
      sha256:
        required: true
        type: string
      installed_run_id:
        description: Successful full installed matrix run
        required: true
        type: string
      core_run_id:
        description: Successful minimal-core lower-bound matrix run
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify public release and minimal-core qualification
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          VERSION: ${{ inputs.version }}
          SHA256: ${{ inputs.sha256 }}
          CORE_RUN_ID: ${{ inputs.core_run_id }}
        run: python devtools/conda-build/verify_core_release.py
  promote:
    needs: release
    uses: uibcdf/molsyssuite/.github/workflows/promote-noarch-conda.yaml@5090a656cd8223826947575f329ee52aa664c725
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
      version: ${{ inputs.version }}
      sha256: ${{ inputs.sha256 }}
      installed_run_id: ${{ inputs.installed_run_id }}
    secrets:
      ANACONDA_TOKEN: ${{ secrets.ANACONDA_UIBCDF_TOKEN }}
