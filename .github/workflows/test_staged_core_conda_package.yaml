name: Test staged minimal core
run-name: Core installed argdigest-${{ inputs.version }}-py_${{ inputs.build_number }}.tar.bz2 ${{ inputs.sha256 }}
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        required: true
        type: string
      version:
        required: true
        type: string
      build_number:
        required: true
        type: number
      sha256:
        required: true
        type: string
permissions:
  contents: read
jobs:
  core:
    name: Core ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Create a clean environment from the exact staged build
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-name: core
          condarc: |
            channels:
              - uibcdf/label/staging
              - uibcdf
              - conda-forge
            channel_priority: flexible
          create-args: >-
            python=${{ matrix.python }}
            uibcdf/label/staging::argdigest=${{ inputs.version }}=py_${{ inputs.build_number }}
            uibcdf::depdigest=0.11.0=py_2
            uibcdf::smonitor=0.16.0=py_1
      - name: Verify exact installed core without NumPy
        shell: bash -l {0}
        env:
          EXPECTED_SHA256: ${{ inputs.sha256 }}
          CANDIDATE_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          set -euo pipefail
          checker="$GITHUB_WORKSPACE/devtools/conda-build/verify_staged_install.py"
          probe="$GITHUB_WORKSPACE/devtools/conda-build/core_runtime_probe.py"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cd "$(cygpath -u "$RUNNER_TEMP")"
          else
            cd "$RUNNER_TEMP"
          fi
          python "$checker" installed --prefix "$CONDA_PREFIX" \
            --sha256 "$EXPECTED_SHA256" --version "$CANDIDATE_VERSION" \
            --build-number "$BUILD_NUMBER" --python-version "$PYTHON_VERSION"
          python -P "$probe"
