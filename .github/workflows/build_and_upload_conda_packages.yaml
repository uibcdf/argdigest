name: Build and upload conda packages
on:
  release:
    types: ['released']
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full source SHA matching the committed release decision
        required: true
        type: string
      version:
        description: Canonical version from the committed plan
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  decision:
    runs-on: ubuntu-latest
    outputs:
      candidate: ${{ steps.plan.outputs.candidate }}
      route: ${{ steps.plan.outputs.route }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact source, tag and committed route
        id: plan
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          VERSION: ${{ inputs.version || github.event.release.tag_name }}
          EVENT: ${{ github.event_name }}
        run: |
          python - <<'CHECK'
          import os, re, subprocess, tomllib
          plan = tomllib.load(open('devtools/conda-build/release_plan.toml', 'rb'))
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert re.fullmatch(r'[0-9a-f]{40}', sha)
          assert plan['version'] == os.environ['VERSION']
          assert plan['route'] in ('staged', 'direct')
          if os.environ['EVENT'] == 'workflow_dispatch':
              assert sha == os.environ['CANDIDATE_SHA']
              assert plan['route'] == 'staged'
          else:
              tag_sha = subprocess.check_output(['git', 'rev-list', '-n', '1', os.environ['VERSION']], text=True).strip()
              assert tag_sha == sha
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f"candidate={sha}\nroute={plan['route']}\n")
          CHECK
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Check out the reviewed shared preflight
        uses: actions/checkout@v6
        with:
          repository: uibcdf/molsyssuite
          ref: 43b9f94bf5ab0ec3f54a4b2ca5b23b791d6af0bc
          path: .molsyssuite-dependencies
          persist-credentials: false
      - name: Install preflight parser tools
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3' 'Jinja2>=3,<4' 'packaging>=24'
      - name: Check exact candidate dependency routes before building
        run: python -B .molsyssuite-dependencies/devtools/scripts/dependency_routes.py --root . --inventory devtools/dependency_routes.toml
  publish:
    needs: decision
    if: github.event_name == 'workflow_dispatch' || needs.decision.outputs.route == 'direct'
    uses: uibcdf/molsyssuite/.github/workflows/publish-noarch-conda.yaml@5090a656cd8223826947575f329ee52aa664c725
    with:
      candidate_sha: ${{ needs.decision.outputs.candidate }}
      version: ${{ inputs.version || github.event.release.tag_name }}
    secrets:
      ANACONDA_TOKEN: ${{ secrets.ANACONDA_UIBCDF_TOKEN }}
