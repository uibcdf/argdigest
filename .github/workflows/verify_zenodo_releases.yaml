name: Verify Zenodo release archival
on:
  release:
    types: [published]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Exact public tag, or empty for all releases since adoption
        required: false
        default: ""
        type: string
permissions:
  contents: read
jobs:
  archival:
    uses: uibcdf/molsyssuite/.github/workflows/verify-zenodo-releases.yaml@5090a656cd8223826947575f329ee52aa664c725
    with:
      concept-doi: "10.5281/zenodo.22892325"
      since: "2026-10-04T00:00:00Z"
      tag: ${{ github.event.release.tag_name || inputs.tag || '' }}
