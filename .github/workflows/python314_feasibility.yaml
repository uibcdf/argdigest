name: Python 3.14 feasibility (not a support claim)

on:
  workflow_dispatch:

jobs:
  source-feasibility:
    name: Source feasibility on ${{ matrix.os }}, Python 3.14
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: devtools/conda-envs/test_env_core.yaml
          environment-name: feasibility
          condarc: |
            channels:
              - uibcdf
              - conda-forge
            channel_priority: strict
          create-args: >-
            python=3.14
          cache-downloads: true
      - name: Generate version and install development source
        shell: bash -l {0}
        run: |
          set -euo pipefail
          python -m pip install --no-build-isolation --no-deps --ignore-requires-python -e .
      - name: Test editable development source (no public support claim)
        shell: bash -l {0}
        run: |
          set -euo pipefail
          python -m pytest --receptor=ci -n 4 -q
