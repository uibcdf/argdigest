name: CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  dependency-contract:
    name: Review dependency routes before testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Check out the reviewed shared preflight
        uses: actions/checkout@v6
        with:
          repository: uibcdf/molsyssuite
          ref: 43b9f94bf5ab0ec3f54a4b2ca5b23b791d6af0bc
          path: .molsyssuite-dependencies
          persist-credentials: false
      - name: Install preflight parser tools
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3' 'Jinja2>=3,<4' 'packaging>=24'
      - name: Check dependency routes
        run: python -B .molsyssuite-dependencies/devtools/scripts/dependency_routes.py --root . --inventory devtools/dependency_routes.toml

  test:
    needs: dependency-contract
    name: Test on ubuntu-latest, Python 3.14
    if: >
      !(
        github.event_name == 'push' && contains(github.event.head_commit.message, '[skip ci]')
      )
      &&
      (
        github.event_name == 'push'
        || github.event_name == 'pull_request'
        || github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: ci-fast-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Additional info about the build
      shell: bash
      run: |
        uname -a

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - name: Setup conda env
      uses: mamba-org/setup-micromamba@v3.2.1
      with:
        environment-file: devtools/conda-envs/test_env.yaml
        environment-name: test
        condarc: |
          channels:
            - uibcdf
            - conda-forge
          channel_priority: strict

        create-args: >-
          python=3.14

    - name: Info conda
      shell: bash -l {0}
      run: |
        micromamba activate test
        micromamba info
        micromamba list

    - name: Build wheel
      shell: bash -l {0}
      run: |
        set -euo pipefail
        python -m pip wheel . --no-deps -w dist
        ls -1 dist/argdigest-*.whl

    - name: Install from wheel
      shell: bash -l {0}
      run: |
        set -euo pipefail
        python -m pip uninstall -y argdigest || true
        WHEEL_PATH="$(ls -1 dist/argdigest-*.whl | head -n 1)"
        python -m pip install "$WHEEL_PATH" --no-deps

    - name: Test import module (installed wheel)
      shell: bash -l {0}
      run: |
        set -euo pipefail
        echo "::group::Importing module from home directory"
        trap 'echo "::endgroup::"' EXIT
        cd
        pwd
        python -c 'import argdigest, pyunitwizard; print("ArgDigest: {} PyUnitWizard: {}".format(argdigest.__version__, pyunitwizard.__version__))'

    - name: Run tests

      # conda setup requires this special shell
      shell: bash -l {0}

      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)
        python -m pytest --receptor=ci -n 4 --cov-config=.coveragerc --cov=argdigest --cov-report=xml --junitxml=junit.xml

    - name: Check coverage
      shell: bash -l {0}
      run: |
        cat ./coverage.xml

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      with:
        verbose: true
        file: ./coverage.xml
        flags: unittests
        name: codecov-ubuntu-latest-py3.14
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload test results to Codecov
      uses: codecov/test-results-action@v1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
